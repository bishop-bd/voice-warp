name: Build native AI runtime candidates

# Candidates require separate hardware/speech qualification and release review.
# No upload to a public runtime catalog or signing credentials on pull requests.
on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime version for candidate manifests
        default: '2.0.0'
        required: true

permissions:
  contents: read

jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            backend: cpu
            target: windows-x64
            arch: x64
          - os: windows-2022
            backend: cuda
            target: windows-x64
            arch: x64
          - os: windows-2022
            backend: directml
            target: windows-x64
            arch: x64
          - os: macos-15
            backend: cpu
            target: macos-arm64
            arch: arm64
          - os: macos-15
            backend: mps
            target: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: ${{ matrix.arch }}
      - name: Build, probe and relocate native runtime
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          RUNTIME_BACKEND: ${{ matrix.backend }}
          RUNTIME_TARGET: ${{ matrix.target }}
          BUILD_NUMBER: ${{ github.run_id }}
        run: python scripts/build-ai-runtime.py --backend "$env:RUNTIME_BACKEND" --build-id "$env:RUNTIME_TARGET-$env:RUNTIME_BACKEND-$env:BUILD_NUMBER" --runtime-version "$env:RUNTIME_VERSION"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ai-runtime-${{ matrix.target }}-${{ matrix.backend }}
          path: dist/ai-runtimes/*
          if-no-files-found: error
          retention-days: 14
