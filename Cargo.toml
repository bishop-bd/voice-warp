[package]
name = "voice-warp"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform voice changer and soundboard with virtual microphone routing"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
hound = "3.5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
directories = "6"
fs2 = "0.4"
ctrlc = { version = "3.4", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.16"
crossbeam-queue = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
strip = true

